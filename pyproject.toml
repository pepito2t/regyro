[project]
name = "regyro"
version = "0.1.0"
description = "Reconstruct gyroscope data from video for Gyroflow stabilization"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "telemetry-parser>=0.3",
]

[project.scripts]
regyro = "regyro.cli:main"

[project.optional-dependencies]
# torch 2.8 dropped Pascal (sm_61) kernels — the training box is a GTX 1080 Ti.
ml = [
    "torch>=2.4,<2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regyro"]
